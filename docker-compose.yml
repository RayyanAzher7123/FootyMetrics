services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: footymetrics
      POSTGRES_PASSWORD: footymetrics
      POSTGRES_DB: footymetrics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footymetrics -d footymetrics"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://footymetrics:footymetrics@db:5432/footymetrics
      MODEL_DIR: /app/ml/models
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/ml/models:ro
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
