# The API reads CSV and joblib files. `docker compose up` starts the API and the web app.
# PostgreSQL is reserved for a later persistence change and stays out of that path:
#   docker compose --profile postgres up --build

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MODEL_DIR: /app/ml/models
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/ml/models:ro
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: footymetrics
      POSTGRES_PASSWORD: footymetrics
      POSTGRES_DB: footymetrics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footymetrics -d footymetrics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
